<!DOCTYPE html>
<html>
 <head>
 <title>Kaart</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.js"></script>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.5.1/leaflet.css" />
 <style>
   body {padding: 0; margin: 0; }
   html, body { height: 100%; width: 100%;}
   #kaardikiht {float:bottom; width:100%; height:100%;}
 </style>
 <script>
   var kaart;
   function algus(){
    kaart = L.map('kaardikiht').setView([59.408, 24.708], 13);
      new L.TileLayer(
  'https://tiles.maaamet.ee/tm/tms/1.0.0/hybriid@GMC/{z}/{x}/{y}.png&ASUTUS=TLU&ERIALA=DIGIHUMANITAARIA', {
	  attribution: "Map: <a  href='http://www.maaamet.ee/'>Maa-amet</a>",
	  tms: true,
    }).addTo(kaart);
    L.marker([59.408, 24.708]).addTo(kaart);
    L.circleMarker([59.400, 24.650]).addTo(kaart);  
    L.circle([59.410, 24.710], {radius: 1000}).addTo(kaart).bindPopup("Raudteejaam");    
    L.circle([59.408601, 24.708259], {radius: 1000, color: "yellow"}).addTo(kaart);    

   }

  </script>
 </head>  
 <body onload="algus()">
  <div id="kaardikiht"></div>
 </body>
</html>
