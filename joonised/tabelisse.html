<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ilma illustreerivad lumememmed ja andmete sisestamine</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .sisestusvorm {
        margin-bottom: 20px;
        padding: 15px;
        background-color: #f2f2f2;
        border-radius: 6px;
        display: inline-block;
      }
      .sisestusvorm label {
        margin-right: 5px;
        font-weight: bold;
      }
      .sisestusvorm input[type="text"],
      .sisestusvorm input[type="number"] {
        width: 100px;
        padding: 5px;
        margin-right: 15px;
      }
      .sisestusvorm input[type="button"],
      .sisestusvorm button {
        padding: 6px 12px;
        cursor: pointer;
      }
      #olek {
        margin-left: 10px;
        font-style: italic;
      }
      .tahvel-konteiner {
        overflow-x: auto;
        margin-top: 10px;
      }
      canvas {
        border: 1px solid #ccc;
        background-color: #ffffff;
      }
    </style>
    <script>
      let g;
      const veebiteenus = "https://script.google.com/macros/s/AKfycbxd1zs034sXsErjtWqRTbs2xvaYZTl4Al7fht9lof8-kiSLMRNE7UyFUCM-vLv4rFl-Yw/exec";

      let ilmaandmed = [];

      // Funktsioon lumememme joonistamiseks ilmaandmete põhjal
      // x, y - alumise palli keskpunkti koordinaadid
      // temp - temperatuur (suurem temp -> suurem alumine pall)
      // tuul - tuule kiirus (suurem tuul -> suurem keskmine pall)
      // puhang - puhangukiirus (suurem puhang -> suurem ülemine pall)
      // kuupaev - kuupäevatekst, mis joonistatakse alumise palli keskele
      function lumememm(x, y, temp, tuul, puhang, kuupaev){
        let r1 = Math.abs(Number(temp)) * 8;      // alumise palli raadius
        let r2 = Math.abs(Number(tuul)) * 4;      // keskmise palli raadius
        let r3 = Math.abs(Number(puhang)) * 1;    // ülemise palli raadius

        // Alumine pall (temperatuur)
        g.beginPath();
        g.arc(x, y, r1, 0, 2 * Math.PI);
        g.stroke();

        // Kuupäev alumise palli keskele
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.font = "14px Arial";
        g.fillStyle = "black";
        g.fillText(kuupaev, x, y);

        // Keskmine pall (tuule kiirus)
        let y2 = y - r1 - r2;
        g.beginPath();
        g.arc(x, y2, r2, 0, 2 * Math.PI);
        g.stroke();

        // Ülemine pall (puhangu kiirus)
        let y3 = y2 - r2 - r3;
        g.beginPath();
        g.arc(x, y3, r3, 0, 2 * Math.PI);
        g.stroke();
      }

      function joonista(){
        let tahvel = document.getElementById("tahvel");
        g = tahvel.getContext("2d");

        // Kui andmeid on rohkem, laiendame vajadusel lõuendit
        let vajalikLaius = Math.max(900, 90 + ilmaandmed.length * 150);
        if (tahvel.width !== vajalikLaius) {
          tahvel.width = vajalikLaius;
        }

        g.clearRect(0, 0, tahvel.width, tahvel.height);

        // Joonistame iga päeva ilmaandmete põhjal lumememme
        for(let i = 0; i < ilmaandmed.length; i++){
          let d = ilmaandmed[i];
          let x = 90 + i * 150;
          let y = 250;
          lumememm(x, y, d[1], d[2], d[3], d[0]);
        }
      }

      function uuendaAndmed(){
        let olek = document.getElementById("olek");
        if (olek) olek.innerText = "Laen andmeid...";

        fetch(veebiteenus)
          .then(d => d.json())
          .then(andmed => {
            loe(andmed);
            if (olek) olek.innerText = "Andmed laaditud.";
          })
          .catch(err => {
            console.error(err);
            if (olek) olek.innerText = "Viga andmete laadimisel.";
          });
      }

      function loe(andmed){
        if (Array.isArray(andmed)) {
          ilmaandmed = andmed;
          joonista();
        } else {
          // Vajadusel küsime uuesti
          uuendaAndmed();
        }
      }

      function lisaAndmed(){
        let kuupaev = document.getElementById("kuupaev").value.trim();
        let temperatuur = document.getElementById("temperatuur").value.trim();
        let tuul = document.getElementById("tuul").value.trim();
        let puhang = document.getElementById("puhang").value.trim();
        let olek = document.getElementById("olek");

        if(!kuupaev || temperatuur === "" || tuul === "" || puhang === ""){
          alert("Palun täida kõik väljad!");
          return;
        }

        if (olek) olek.innerText = "Saadan andmeid tabelisse...";

        // Päringu aadress andmete lisamiseks tabelisse
        let url = veebiteenus + 
          "?kuupaev=" + encodeURIComponent(kuupaev) +
          "&temperatuur=" + encodeURIComponent(temperatuur) +
          "&tuul=" + encodeURIComponent(tuul) +
          "&puhang=" + encodeURIComponent(puhang);

        fetch(url)
          .then(d => d.json())
          .then(andmed => {
            loe(andmed);
            if (olek) olek.innerText = "Andmed tabelisse lisatud!";
            // Tühjendame väljad
            document.getElementById("kuupaev").value = "";
            document.getElementById("temperatuur").value = "";
            document.getElementById("tuul").value = "";
            document.getElementById("puhang").value = "";
          })
          .catch(err => {
            console.error(err);
            if (olek) olek.innerText = "Viga andmete saatmisel.";
          });
      }
    </script>
  </head>
  <body onload="uuendaAndmed()">
    <h1>Ilmaennustuse lumememmed</h1>
    <p>Alumine pall = temperatuur | Keskmine pall = tuule kiirus | Ülemine pall = puhangu kiirus</p>

    <!-- Kasutaja sisestusvorm andmete saatmiseks tabelisse -->
    <div class="sisestusvorm">
      <label for="kuupaev">Kuupäev:</label>
      <input type="text" id="kuupaev" placeholder="nt 18.11">

      <label for="temperatuur">Temperatuur:</label>
      <input type="number" id="temperatuur" placeholder="nt 11">

      <label for="tuul">Tuul:</label>
      <input type="number" id="tuul" placeholder="nt 7">

      <label for="puhang">Puhang:</label>
      <input type="number" id="puhang" placeholder="nt 9">

      <input type="button" value="Lisa tabelisse" onclick="lisaAndmed()">
      <input type="button" value="Uuenda" onclick="uuendaAndmed()">
      <span id="olek"></span>
    </div>

    <div class="tahvel-konteiner">
      <canvas id="tahvel" width="900" height="340">
      </canvas>
    </div>
  </body>
</html>
