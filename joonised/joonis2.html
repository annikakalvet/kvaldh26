<!doctype html>
<html>
  <head>
    <title>Joonis</title>
	<script>
	  function joonista(){
	    let g=tahvel.getContext("2d");
	    g.fillStyle="black";
		g.fillRect(10, 10, 50, 20);
	    g.fillStyle="green";
		g.fillText("abc", 100, 10);
		g.beginPath();
        g.moveTo(10, 150);
		g.lineTo(50, 100);
		g.lineTo(90, 150);
	    g.stroke();
      //Joonistage koodi abil pink ja väike maja
	  }
	</script>
  </head>
  <body onload="joonista()">
    <h1>Joonistamine</h1>
	<canvas id="tahvel" width="400" height="300">
	</canvas>
  </body>
</html>
