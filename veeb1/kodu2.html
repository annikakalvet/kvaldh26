<!doctype html>
<html>
  <head>
    <title>Peokutse</title>
    <script>
      function jah() {
        vastus.innerText = "Super, näeme seal!";
      }

      function ei() {
        vastus.innerText = "Kahju, näeme varsti!";
      }

      function voibolla() {
        vastus.innerText = "Loodame sind näha!";
      }
    </script>
  </head>

  <body style="background-color:lightblue">
    Kas sa tuled meie peole? <br />

    <input type="button" value="Jah" onclick="jah()" />
    <input type="button" value="Ei" onclick="ei()" />
    <input type="button" value="Võib-olla" onclick="voibolla()" />

    <p id="vastus">Vali vastus!</p>
  </body>
  <img src="https://static.wikia.nocookie.net/shrek/images/8/84/Cute_Eyes.jpeg/revision/latest?cb=20250806052228"/>
</html>
