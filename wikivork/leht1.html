
<!DOCTYPE html>
<html lang="et">
<head>
  <link
  href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css"
  rel="stylesheet"
/>

<script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eesti kirjanike võrgustik</title>

  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #253447;
    }

    #network {
      height: 650px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 20px;
    }

    #info {
      padding: 14px;
      background: #f2f5f8;
      border-radius: 8px;
      margin-top: 15px;
    }

    button, input {
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <section>
  <h2>Eesti kirjanike ajajoon</h2>
  <p>Kirjanikud sünniaasta järgi.</p>

  <input type="file" id="timelineFile" accept=".csv,text/csv">

  <div id="timeline" style="
    height: 500px;
    border: 1px solid #ccc;
    margin-top: 15px;
  "></div>

  <p id="timelineInfo"></p>
</section>
  <h1>Eesti kirjanike ja koolide võrgustik</h1>

  <p>
    Laadi üles Wikidata päringu CSV-fail.
    Klõpsa graafi sõlmedel, et uurida seoseid.
  </p>

  <input type="file" id="file" accept=".csv,text/csv">

  <div id="network"></div>

  <div id="info">
    Vali graafist kirjanik või kool.
  </div>

  <script>
    const nodes = new vis.DataSet([]);
    const edges = new vis.DataSet([]);
    let network;

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];

        if (c === '"') {
          if (quoted && text[i + 1] === '"') {
            cell += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (c === "," && !quoted) {
          row.push(cell.trim());
          cell = "";
        } else if ((c === "\n" || c === "\r") && !quoted) {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(cell.trim());
          if (row.some(v => v !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += c;
        }
      }

      row.push(cell.trim());
      if (row.some(v => v !== "")) rows.push(row);

      return rows;
    }

    document.getElementById("file").addEventListener(
      "change", async event => {
        const file = event.target.files[0];
        if (!file) return;

        const text = await file.text();
        const rows = parseCSV(text);

        if (rows.length < 2) {
          alert("CSV-failis pole piisavalt andmeid.");
          return;
        }

        const headers = rows[0].map(h =>
          h.replace(/^\uFEFF/, "").replace(/^"|"$/g, "")
            .replace(/^\?/, "").toLowerCase()
        );

        const authorIndex = headers.findIndex(h =>
          h.includes("kirjanik") && h.includes("label")
        );
        const schoolIndex = headers.findIndex(h =>
          h.includes("kool") && h.includes("label")
        );

        if (authorIndex < 0 || schoolIndex < 0) {
          alert(
            "Kirjaniku ja kooli veerge ei leitud. " +
            "Kontrolli CSV-faili veerupäiseid."
          );
          return;
        }

        nodes.clear();
        edges.clear();

        const knownNodes = new Set();
        const knownEdges = new Set();

        for (const row of rows.slice(1)) {
          const author = row[authorIndex]?.trim();
          const school = row[schoolIndex]?.trim();

          if (!author || !school) continue;

          const authorId = "author:" + author;
          const schoolId = "school:" + school;

          if (!knownNodes.has(authorId)) {
            nodes.add({
              id: authorId,
              label: author,
              group: "author",
              shape: "dot",
              color: "#4778a8",
              size: 12
            });
            knownNodes.add(authorId);
          }

          if (!knownNodes.has(schoolId)) {
            nodes.add({
              id: schoolId,
              label: school,
              group: "school",
              shape: "box",
              color: "#d6a64f",
              font: { color: "#253447" }
            });
            knownNodes.add(schoolId);
          }

          const edgeId = authorId + "->" + schoolId;

          if (!knownEdges.has(edgeId)) {
            edges.add({
              id: edgeId,
              from: authorId,
              to: schoolId
            });
            knownEdges.add(edgeId);
          }
        }

        const options = {
          nodes: {
            font: { size: 14 },
            borderWidth: 1
          },
          edges: {
            color: { color: "#b7c0ca" },
            smooth: false
          },
          physics: {
            stabilization: { iterations: 200 },
            barnesHut: {
              gravitationalConstant: -5000,
              springLength: 120,
              springConstant: 0.03
            }
          },
          interaction: {
            hover: true,
            navigationButtons: true,
            keyboard: true
          }
        };

        if (network) network.destroy();

        network = new vis.Network(
          document.getElementById("network"),
          { nodes, edges },
          options
        );

        network.on("click", params => {
          const info = document.getElementById("info");

          if (params.nodes.length === 0) {
            info.textContent = "Vali graafist kirjanik või kool.";
            return;
          }

          const node = nodes.get(params.nodes[0]);
          const connected = network.getConnectedNodes(node.id);

          info.innerHTML = "";

          const title = document.createElement("strong");
          title.textContent = node.label;
          info.appendChild(title);

          const description = document.createElement("p");
          description.textContent =
            (node.group === "author" ? "Kirjanik" : "Kool") +
            ". Seotud sõlmi: " + connected.length;
          info.appendChild(description);

          const list = document.createElement("ul");

          connected.forEach(id => {
            const li = document.createElement("li");
            li.textContent = nodes.get(id).label;
            list.appendChild(li);
          });

          info.appendChild(list);
        });
      }
    );
  </script>
  <script>
  document
    .getElementById("timelineFile")
    .addEventListener("change", function (event) {
      const file = event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        const text = e.target.result.replace(/^\uFEFF/, "");
        const rows = text.trim().split(/\r?\n/);

        function parseRow(row) {
          const result = [];
          let value = "";
          let insideQuotes = false;

          for (let i = 0; i < row.length; i++) {
            const char = row[i];

            if (char === '"') {
              if (insideQuotes && row[i + 1] === '"') {
                value += '"';
                i++;
              } else {
                insideQuotes = !insideQuotes;
              }
            } else if (char === "," && !insideQuotes) {
              result.push(value);
              value = "";
            } else {
              value += char;
            }
          }

          result.push(value);
          return result;
        }

        const headers = parseRow(rows[0]).map(h =>
          h.trim().replace(/^\?/, "").toLowerCase()
        );

        const nameIndex = headers.findIndex(h =>
          h.includes("kirjaniklabel")
        );

        const yearIndex = headers.findIndex(h =>
          h.includes("sunniaasta")
        );

        if (nameIndex === -1 || yearIndex === -1) {
          document.getElementById("timelineInfo").textContent =
            "CSV-failist ei leitud kirjaniku nime või sünniaasta veergu.";
          return;
        }

        const items = [];

        rows.slice(1).forEach((row, index) => {
          const columns = parseRow(row);
          const name = columns[nameIndex]?.trim();
          const year = columns[yearIndex]?.trim();

          if (!name || !/^\d{1,4}$/.test(year)) return;

          const numericYear = Number(year);

          if (numericYear < 1 || numericYear > 2026) return;

          items.push({
            id: index + 1,
            content: name,
            start: `${year.padStart(4, "0")}-01-01`,
            title: `${name} – sünniaasta ${year}`
          });
        });

        if (items.length === 0) {
          document.getElementById("timelineInfo").textContent =
            "CSV-failist ei leitud sobivaid andmeid.";
          return;
        }

        const container = document.getElementById("timeline");

        if (window.writerTimeline) {
          window.writerTimeline.destroy();
        }

        window.writerTimeline = new vis.Timeline(
          container,
          new vis.DataSet(items),
          {
            height: "500px",
            zoomMin: 1000 * 60 * 60 * 24 * 365 * 10,
            zoomMax: 1000 * 60 * 60 * 24 * 365 * 500,
            orientation: "top",
            margin: {
              item: 10,
              axis: 5
            }
          }
        );

        document.getElementById("timelineInfo").textContent =
          `Ajajoonele lisati ${items.length} kirjanikku.`;
      };

      reader.readAsText(file, "UTF-8");
    });
</script>
</body>
</html>
